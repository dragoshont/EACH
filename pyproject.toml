[project]
name = "each"
version = "0.1.0"
description = "EACH (Evidence-Audited Cleanroom Harness): authoring-provenance evidence for AI-assisted software repair, not legal certification."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Dragos Hont" }]
dependencies = []

[project.scripts]
each = "each.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["each"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
