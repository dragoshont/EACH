# Ordinary harness CI. Tests the EACH tool itself — never private model
# weights, GitHub tokens, or commercial LLM APIs (see
# docs/EACH_BOOTSTRAP_MANDATE.md §50).
name: CI

on:
  push:
    branches: [main, "dragoshont-each-project-bootstrap"]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: uv sync
        run: uv sync --locked

      - name: uv run ruff check
        run: uv run ruff check each/ tests/

      - name: uv run pytest
        run: uv run pytest -q

      - name: uv run each doctor
        run: uv run each doctor
